<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/d75ad8793d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />   
    <link rel="stylesheet" href="ProfileCard.css">
    <script src="ProfileCard.js"></script>
    <title>Profile Card</title>
</head>
<body>
    <div class="container">
        <!--* PROFILE CARD  -->
        <div class="profile-card">
            <img class="banner" src="Images/388374.jpg" alt="banner">
            
            <div class="profile-container">
                <img class="profile-photo" src="Images/MAGPANTAY, MARK DANIEL C (5.1) edited.png" alt="profile photo">
            </div>

            <div class="information-container">
                <div class="profile-information">
                    <p class="name">Mark Daniel C. Magpantay</p>
                    <p class="degree">Computer Engineer</p>
                </div>
    
                <div class="social-accounts">
                    <a href="mailto:markdanielcmagpantay@gmail.com" target="_blank">
                        <i class="fa-regular fa-envelope fa-xl"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/mark-daniel-magpantay/" target="_blank">
                        <i class="fa-brands fa-linkedin fa-xl"></i>
                    </a>
                    <a href="https://github.com/Nielark" target="_blank">
                        <i class="fa-brands fa-github fa-xl"></i>
                    </a>
                </div>

                <!-- About me button -->
                <div class="about-me">About me</div>
            </div>
        </div>

        <!--* OVERLAY -->
        <div class="overlay"></div>

        <!--* MODAL -->
        <div class="modal">
            <div class="prompt-type">
                <p>Error 404: About Me Not Found</p>
            </div>

            <div class="prompt-messeage">
                <p>Looks like my personality didn’t load. Please try again later.</p>
            </div>

            <div class="button">
                <div class="btn-OK">OK</div>
            </div>
        </div>
    </div>
</body>
</html>
