<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/d75ad8793d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />   
    <link rel="stylesheet" href="ProfileCard.css">
    <script src="ProfileCard.js"></script>
    <title>Profile Card</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="cover-photo"></div>

            <div class="profile-photo"></div>

            <div class="contacts">
                <ul>
                    <li>
                        <a href=""><i class="fa-regular fa-envelope fa-lg"></i></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-brands fa-facebook fa-lg"></i></a></li>
                    <li>
                        <a href=""><i class="fa-brands fa-linkedin fa-lg"></i></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-brands fa-github fa-lg"></i></a>
                    </li>
                </ul>
            </div>

            <div class="info">
                <div class="name-container">
                    <h1>Hello World!</h1>
                    <span class="name">I am Mark Daniel C. Magpantay</span>
                    <span class="degree">a Computer Engineer</span>
                </div>
            </div>

            <footer class="footer">
                <div class="left">
                    <h4>Experience</h4>
                </div>
                <div class="right">
                    <h4>Education History</h4>
                </div>
            </footer>

            <div class="show-skill">
                <div class="skill-toggle-btn">
                    <span>SKILLS</span>
                </div>

                <div class="skill-text">
                    <div class="skill">   
                        <i class="devicon-c-plain"></i>
                    </div>
                    <div class="skill">    
                        <i class="devicon-cplusplus-plain"></i>
                    </div>
                    <div class="skill">  
                        <i class="devicon-csharp-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-arduino-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-java-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-python-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-kotlin-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-go-original-wordmark"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-html5-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-css3-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-javascript-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-php-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-visualbasic-plain"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-mysql-original"></i>
                    </div>
                    <div class="skill">
                        <i class="devicon-git-plain"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
