<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/d75ad8793d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="ProfileCard.css">
    <script src="ProfileCard.js"></script>
    <title>Profile Card</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="cover-photo">

            </div>

            <div class="profile-photo">
                
            </div>

            <div class="info">
                <div class="name">
                    <h3>MARK DANIEL C. MAGPANTAY</h3>
                    <p>COMPUTER ENGINEER</p>
                </div>
            </div>

            <div class="button">
                <button class="objective">Objective</button>
                <button id="skills">Skills</button>
            </div>

            <div class="contacts">
                <ul>
                    <li><a href="">
                        <i class="fa-regular fa-envelope fa-2xl"></i>
                    </a></li>
                    <li><a href="">
                        <i class="fa-brands fa-facebook fa-2xl"></i>
                    </a></li>
                    <li><a href="">
                        <i class="fa-brands fa-linkedin fa-2xl"></i>
                    </a></li>
                    <li><a href="">
                        <i class="fa-brands fa-github fa-2xl"></i>
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
